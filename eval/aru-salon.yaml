# Сапа тесті: бот нақты сұрақтарға дұрыс жауап бере ме, білмейтінін мойындай ма.
#   expect: answer  → жауапта must_contain сөздерінің кемінде біреуі болуы керек
#   expect: handoff   → бизнеске қатысты, бірақ ақпаратта жоқ: бот ойдан шығармай, нөмірді беруі керек
#   expect: off_topic → бизнеске мүлде қатысы жоқ: бот сыпайы бас тартуы керек ("Бұл чат тек ...")
#   expect: lead      → клиент жазылғысы/сатып алғысы келеді: бот иесіне "ЖАҢА ӨТІНІМ" жіберуі керек
# Клиентке тапсырмас бұрын кемінде 50 сұраққа жеткіз.

cases:
  # --- Бағалар ---
  - q: Маникюр қанша тұрады?
    expect: answer
    must_contain: ["4000", "4 000", "7000", "7 000"]
  - q: Гель-лак маникюр бағасы қандай?
    expect: answer
    must_contain: ["7000", "7 000"]
  - q: Педикюр неше тұрады?
    expect: answer
    must_contain: ["8000", "8 000"]
  - q: Әйелдер шашын қию қанша?
    expect: answer
    must_contain: ["5000", "5 000"]
  - q: Балаға шаш қию бағасы?
    expect: answer
    must_contain: ["2500", "2 500"]
  - q: Ұзын шашты бояу қанша болады?
    expect: answer
    must_contain: ["20000", "20 000"]
  - q: Кірпік ұзарту бар ма?
    expect: answer
    must_contain: ["10000", "10 000"]
  - q: Сколько стоит мужская стрижка?
    expect: answer
    must_contain: ["3500", "3 500"]

  # --- Уақыт, мекенжай ---
  - q: Жексенбі күні жұмыс істейсіздер ме?
    expect: answer
    must_contain: ["демалыс", "жұмыс істемей", "жабық"]
  - q: Сенбі күні нешеге дейін ашықсыздар?
    expect: answer
    must_contain: ["18:00", "18"]
  - q: Мекенжайларыңыз қайда?
    expect: answer
    must_contain: ["Тұран"]
  - q: Во сколько вы открываетесь в будни?
    expect: answer
    must_contain: ["09:00", "9:00"]

  # --- Ережелер, төлем, жеңілдік ---
  - q: Kaspi QR арқылы төлеуге бола ма?
    expect: answer
    must_contain: ["Kaspi", "иә", "Иә"]
  - q: Бөліп төлеуге бола ма?
    expect: answer
    must_contain: ["жоқ", "қолжетімді емес", "болмайды"]
  - q: Студенттерге жеңілдік бар ма?
    expect: answer
    must_contain: ["10%", "10 %"]
  - q: Туған күнде жеңілдік бар ма?
    expect: answer
    must_contain: ["15%", "15 %"]
  - q: 20 минут кешіксем не болады?
    expect: answer
    must_contain: ["15 минут", "ауыстыр"]
  - q: Шашты бояуды кім жасайды?
    expect: answer
    must_contain: ["Айгерім"]

  # --- Құжатта ЖОҚ: бот ойдан шығармауы керек ---
  - q: Ботокс жасайсыздар ма?
    expect: handoff
  - q: Массаж қанша тұрады?
    expect: handoff
  - q: Қазақстанның астанасы қай қала?
    expect: off_topic
  - q: Маған үй тапсырмасын шығарып берші
    expect: off_topic
  - q: Есть ли у вас парковка?
    expect: handoff
  - q: Татуаж жасайсыздар ма?
    expect: handoff

  # --- Өтінім: бот иесіне "ЖАҢА ӨТІНІМ" хабарын жіберуі керек ---
  - q: Ертең 15:00-ге маникюрге жазылғым келеді
    expect: lead
  - q: Хочу записаться на стрижку в субботу утром
    expect: lead
