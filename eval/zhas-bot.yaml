cases:
  - q: Бот қанша тұрады?
    expect: answer
    must_contain: ["25 000", "25000", "10 000", "10000"]
  - q: Айына қанша төлеймін?
    expect: answer
    must_contain: ["10 000", "10000", "25 000", "25000"]
  - q: Тегін көруге бола ма?
    expect: answer
    must_contain: ["7 күн", "жеті күн", "бір апта"]
  - q: Бот қай тілде жауап береді?
    expect: answer
    must_contain: ["қазақша", "орысша", "қазақ"]
  - q: Біз тіс клиникасымыз, бізге жарай ма?
    expect: answer
    must_contain: ["клиника", "иә", "Иә", "жарайды"]
  - q: Нөмірім бұғатталып қалмай ма?
    expect: answer
    must_contain: ["ресми", "бұғатталу"]
  - q: Бот қате жауап беріп қоймай ма?
    expect: answer
    must_contain: ["ойдан", "тек", "50 сұрақ"]
  - q: Қанша уақытта дайын болады?
    expect: answer
    must_contain: ["2–3", "2-3", "жұмыс күн"]
  - q: Сізге не керек менен?
    expect: answer
    must_contain: ["баға", "жұмыс уақыт", "мекенжай"]
  - q: WhatsApp өзі ақы ала ма?
    expect: answer
    must_contain: ["1000", "1 000", "Meta"]
  - q: Бот түнде жауап бере ме?
    expect: answer
    must_contain: ["тәулік", "24"]
  - q: Дауыстық хабарламаны түсіне ме?
    expect: answer
    must_contain: ["жоқ", "әзірге", "мәтін"]
  - q: Сколько стоит подключение бота?
    expect: answer
    must_contain: ["бесплат", "тегін", "10 000", "25 000"]
  - q: Орнатуға ақы аласыздар ма?
    expect: answer
    must_contain: ["тегін"]
  - q: Арзанырақ нұсқасы бар ма?
    expect: answer
    must_contain: ["Базалық", "базалық", "10 000", "10000"]
  - q: Базалық пен AI тарифінің айырмашылығы қандай?
    expect: answer
    must_contain: ["мәзір", "батырма"]
  - q: Жаңа нөмір алу керек пе?
    expect: answer
    must_contain: ["қажеті жоқ", "сол күйі", "керек емес"]
  - q: Можно ли попробовать бесплатно?
    expect: answer
    must_contain: ["7 дней", "семь дней", "7 күн", "бесплат"]
  - q: Бот жазылуды күнтізбеге енгізе ме?
    expect: answer
    must_contain: ["әзірле", "әзірге", "жоқ"]

  # --- Ақпаратта жоқ: уәде бермеуі керек ---
  - q: 1С-пен интеграция жасайсыздар ма?
    expect: handoff
  - q: Сайт жасап бересіздер ме?
    expect: handoff
  - q: Python-да тізімді қалай сұрыптаймын?
    expect: off_topic
  - q: Сізде қанша клиент бар?
    expect: handoff
  - q: Бөліп төлеуге бола ма?
    expect: handoff

  # --- Өтінім ---
  - q: Бізге бот керек, Астанада кофейнямыз бар
    expect: lead
  - q: Хочу подключить бота для своего салона
    expect: lead
