# Бір бизнестің баптауы. Жаңа клиент қосу үшін осы папканы көшіріп, мәндерді өзгерт.
id: aru-salon
name: «Ару» сұлулық салоны
# Бас тарту мәтіні үшін: "Бұл чат тек «Ару» сұлулық салоны бойынша көмектеседі"
short_name: «Ару» сұлулық салоны
short_name_ru: салона красоты «Ару»
sector: salon

# ai — еркін сөйлесетін AI бот (knowledge.txt); menu — базалық бот (menu.yaml)
mode: ai

# Meta Developer → WhatsApp → API Setup бетіндегі "Phone number ID".
# Бот қай бизнеске келген хабарлама екенін осы арқылы ажыратады.
phone_number_id: "ОСЫ_ЖЕРГЕ_PHONE_NUMBER_ID"

# Бот жауап бере алмаса, клиентке берілетін нөмір.
contact_phone: "+7 700 123 45 67"

# Өтінімдер ("жазылғым келеді") мен "адам керек" хабарлары осы Telegram чатқа келеді.
# Бос болса — .env ішіндегі TELEGRAM_CHAT_ID. Қалай алу керегі README-де.
telegram_chat_id: ""

greeting: >-
  Сәлеметсіз бе! «Ару» салонының көмекшісімін.
  Бағалар, жұмыс уақыты, шеберлер мен жазылу туралы сұрай беріңіз.

# Бизнеске тән қосымша ережелер (промптқа қосылады).
extra_rules: |
  - Клиент жазылғысы келсе: қандай қызмет, қай күні, қай уақытта екенін сұра (шеберді де таңдай алады).
    Жазылуды өзің растама — әкімші бос уақытты тексеріп, растайтынын айт.
  - Қызмет бағасын айтқанда, ол "бастап" деп жазылса, соңғы баға шебердің қарауына байланысты екенін ескерт.
