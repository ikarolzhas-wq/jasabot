# «Ару» салонының базалық мәзірі. Қолдану үшін config.yaml ішінде mode: menu қой.
# Батырма атауы 20 таңбадан аспауы керек.

welcome: "Сәлеметсіз бе! «Ару» сұлулық салонына қош келдіңіз 🌸"

menu:
  text: "Таңдаңыз 👇"
  items:
    - title: "📋 Бағалар"
      text: "Қай қызмет?"
      items:
        - title: "Шаш"
          answer: |
            Әйелдер шашын қию — 5 000 ₸
            Ерлер шашын қию — 3 500 ₸
            Балалар (12 жасқа дейін) — 2 500 ₸
            Бояу — 15 000 ₸-ден (ұзын шаш 20 000 ₸)
            Мелирование — 18 000 ₸
            Укладка — 4 000 ₸
          also: ["✍️ Жазылу"]
        - title: "Тырнақ"
          answer: |
            Классикалық маникюр — 4 000 ₸
            Гель-лак маникюр — 7 000 ₸
            Педикюр — 8 000 ₸
            Тырнақ ұзарту — 12 000 ₸
            Гель-лакты алу — 1 500 ₸
          also: ["✍️ Жазылу"]
        - title: "Қас пен кірпік"
          answer: |
            Қасқа пішін беру — 2 500 ₸
            Қасты бояу — 2 000 ₸
            Кірпік ұзарту — 10 000 ₸
            Бетті тазалау — 9 000 ₸
          also: ["✍️ Жазылу"]

    - title: "🕐 Уақыт, мекенжай"
      answer: |
        📍 Астана, Тұран даңғылы 25
        Дс–Жм: 09:00–20:00
        Сб: 10:00–18:00
        Жс: демалыс
      also: ["✍️ Жазылу"]

    - title: "🎁 Жеңілдіктер"
      answer: |
        🎂 Туған күніңізде — 15% (жеке куәлік көрсетіледі)
        🎓 Студенттерге дүйсенбі мен сәрсенбі — 10%
        Жеңілдіктер бір-бірімен қосылмайды.
      also: ["✍️ Жазылу"]

    - title: "✍️ Жазылу"
      action: form
      form: booking

    - title: "📞 Әкімші"
      action: human

forms:
  booking:
    steps:
      - ask: "Қай қызметке жазыласыз?"
        label: "Қызмет"
        options: ["Шаш", "Тырнақ", "Қас пен кірпік"]
      - ask: "Қай күні?"
        label: "Күні"
        options: ["Бүгін", "Ертең", "Басқа күн"]
      - ask: "Қай уақытта? Мысалы: 15:00"
        label: "Уақыты"
    done: |
      Рахмет! Өтініміңіз қабылданды ✅
      Әкімші бос уақытты тексеріп, жақын арада растайды.

human_text: "Жақсы, әкімшіге хабарладым, жақын арада жауап береді 🙏 Шұғыл болса: +7 700 123 45 67"
