# Сенің өз қызметіңнің боты: бизнес иелерінің "WhatsApp бот" туралы сұрақтарына жауап береді.
# Бағалар мен шарттар — жоба нұсқасы. knowledge.txt ішінде өзің түзет.
id: zhas-bot
name: JasaBot — бизнеске WhatsApp бот жасаймыз
# Бас тарту мәтіні үшін: "Бұл чат тек JasaBot қызметі бойынша көмектеседі"
short_name: JasaBot қызметі
short_name_ru: сервиса JasaBot
sector: ai-service

# menu — базалық бот (menu.yaml, AI-сыз, Claude шығыны жоқ); ai — еркін сөйлесетін AI бот (knowledge.txt)
mode: menu

phone_number_id: "ZHAS_BOT_PHONE_NUMBER_ID"   # тек PROVIDER=meta болса керек
# YCloud режимінде бот бизнесті осы нөмір бойынша таниды (JasaBot SIM-картасының нөмірі)
whatsapp_number: "+7 702 114 38 55"

# Өз нөміріңді жаз
contact_phone: "+7 702 114 38 55"

# Өтінімдер ("жазылғым келеді") мен "адам керек" хабарлары осы Telegram чатқа келеді.
# Бос болса — .env ішіндегі TELEGRAM_CHAT_ID. Қалай алу керегі README-де.
telegram_chat_id: ""

greeting: >-
  Сәлеметсіз бе! Бұл — JasaBot. Біз бизнеске WhatsApp бот жасаймыз.
  Дәл қазір сөйлесіп отырған осы бот — біз жасайтын боттың үлгісі.
  Бағасы, мүмкіндіктері, қосылу тәртібі туралы сұрай беріңіз.

extra_rules: |
  - Сен бизнес иелерімен сөйлесесің. Сыпайы, нақты және сенімді жаз, бірақ асыра мақтама.
  - Ақпаратта жоқ мүмкіндікті ("дауыспен жауап береді", "1С-ке қосылады" т.б.) уәде етпе — ондай сұраққа [[HANDOFF]] жаз.
  - Клиент қосылғысы немесе сынап көргісі келсе: бизнесінің түрі мен атауын, қай қалада екенін, қашан хабарласқан ыңғайлы екенін сұра.
    Өтінімін қабылдағаныңды, жақын арада хабарласатынымызды айт.
  - Бағаны айтқанда, WhatsApp хабарлама ақысы бөлек, оны бизнес Meta-ға тікелей төлейтінін ескерт.
