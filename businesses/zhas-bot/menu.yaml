# JasaBot — базалық режимдегі мәзір (config.yaml ішінде mode: menu).
# Батырма атауы 20 таңбадан аспауы керек. Бағаларды осы жерде өзгерт.

welcome: |
  Сәлеметсіз бе! JasaBot-қа қош келдіңіз 👋
  Біз бизнеске арналған WhatsApp боттарын жасаймыз. Бот клиенттеріңізге тәулік бойы жауап беріп, өтінімдерді жинайды.

  Қазір сөйлесіп отырған осы бот — біз жасайтын боттың үлгісі.

menu:
  text: "Қай сұрақ қызықтырады?"
  items:
    - title: "🤖 Бот не істейді"
      answer: |
        *Бот сіздің орныңызға:*
        • бағалар, жұмыс уақыты, мекенжай туралы сұрақтарға жауап береді
        • жазылу өтінімдерін қабылдап, сізге жібереді
        • күрделі сұрақты әкімшіге бағыттайды

        Бот түнде де, демалыс күндері де жұмыс істейді.
        Барлық хабарлама WhatsApp Business қосымшаңызда сақталады. Клиентке өзіңіз жазсаңыз, бот бұл чатқа араласпайды.
      also: ["💰 Бағасы", "📝 Қосылу"]

    - title: "💰 Бағасы"
      answer: |
        *10 000 ₸ / ай*

        Бағаға кіреді:
        • мәзірі мен батырмалары бар бот
        • бизнесіңізге бейімделген мәтіндер мен бағалар
        • өтінімдер туралы хабарлама

        Орнату — тегін. Алғашқы 7 күн — тегін.
        Келісімшарт мерзімі — кемінде 3 ай.

        WhatsApp хабарламаларының ақысы бөлек: айына 1 000 хабарлама тегін, одан кейін бір хабарлама шамамен 8–9 ₸.
      also: ["🎁 Тегін сынақ", "📝 Қосылу"]

    - title: "🎁 Тегін сынақ"
      answer: |
        *7 күн тегін*

        Ботты сіздің нөміріңізге, сіздің бағаларыңызбен баптаймыз. Бір апта бойы нақты клиенттермен қалай жұмыс істейтінін көресіз.

        Ұнамаса — ештеңе төлемейсіз, бот өшіріледі.
      also: ["📝 Қосылу", "💰 Бағасы"]

    - title: "⚙️ Қалай қосылады"
      answer: |
        *Қосылу 3 қадамнан тұрады:*

        1️⃣ Бизнесіңіз туралы ақпарат аламыз: қызметтер, бағалар, жұмыс уақыты, мекенжай.
        2️⃣ Ботты баптап, тексереміз.
        3️⃣ Қазіргі WhatsApp Business нөміріңізге қосамыз. Нөміріңіз бен қосымшаңыз өзгермейді — тек Facebook арқылы растайсыз (шамамен 10 минут).

        Ақпарат толық болса, бот 2–3 жұмыс күнінде дайын болады.
      also: ["📝 Қосылу", "🎁 Тегін сынақ"]

    - title: "📝 Қосылу"
      action: form
      form: connect

    - title: "📞 Менеджер"
      action: human

forms:
  connect:
    steps:
      - ask: "Бизнесіңіз қай салада?"
        label: "Сала"
        options: ["Сұлулық салоны", "Клиника", "Автосервис", "Мейрамхана, кафе", "Оқу орталығы", "Фитнес, спорт", "Дүкен", "Басқа"]
      - ask: "Бизнесіңіздің атауы мен қаласын жазыңыз.\nМысалы: «Ару» салоны, Астана"
        label: "Атауы, қаласы"
      - ask: "Рахмет! Өтінім дайын. Менеджерге жіберейік пе?"
        options: ["📨 Менеджерге жіберу"]
        confirm: true
    done: |
      Өтініміңіз менеджерге жіберілді ✅
      Ол осы WhatsApp нөміріне жақын арада жазады.

      JasaBot командасы

human_text: "Сұрағыңызды менеджерге жібердім. Ол осы чатқа жақын арада жазады 🙏"
fallback: "Кешіріңіз, мен тек мәзір арқылы жауап беремін. Төмендегі батырмалардың бірін таңдаңыз 👇"

# ============================================================
# Орысша нұсқа. Клиент орысша жазса — бот осы мәзірмен жауап береді.
# "label" — өтінімде саған көрінетін атау (қазақша қалдырдық).
# ============================================================
ru:
  welcome: |
    Здравствуйте! Добро пожаловать в JasaBot 👋
    Мы создаём WhatsApp-ботов для бизнеса. Бот круглосуточно отвечает вашим клиентам и собирает заявки.

    Этот чат — пример бота, которого мы делаем.

  menu:
    text: "Что вас интересует?"
    items:
      - title: "🤖 Что умеет бот"
        answer: |
          *Бот вместо вас:*
          • отвечает на вопросы о ценах, графике работы и адресе
          • принимает заявки на запись и передаёт их вам
          • направляет сложные вопросы администратору

          Бот работает ночью и в выходные.
          Вся переписка сохраняется в вашем WhatsApp Business. Если вы пишете клиенту сами, бот в этот чат не вмешивается.
        also: ["💰 Стоимость", "📝 Подключиться"]

      - title: "💰 Стоимость"
        answer: |
          *10 000 ₸ / мес*

          В стоимость входит:
          • бот с меню и кнопками
          • тексты и цены под ваш бизнес
          • уведомления о заявках

          Настройка — бесплатно. Первые 7 дней — бесплатно.
          Минимальный срок договора — 3 месяца.

          Сообщения WhatsApp оплачиваются отдельно: 1 000 сообщений в месяц бесплатно, далее около 8–9 ₸ за сообщение.
        also: ["🎁 Бесплатный тест", "📝 Подключиться"]

      - title: "🎁 Бесплатный тест"
        answer: |
          *7 дней бесплатно*

          Настраиваем бота на ваш номер и с вашими ценами. За неделю вы увидите, как он работает с реальными клиентами.

          Не понравится — ничего не платите, бот отключается.
        also: ["📝 Подключиться", "💰 Стоимость"]

      - title: "⚙️ Как подключить"
        answer: |
          *Подключение — 3 шага:*

          1️⃣ Получаем информацию о бизнесе: услуги, цены, график, адрес.
          2️⃣ Настраиваем и тестируем бота.
          3️⃣ Подключаем к вашему текущему номеру WhatsApp Business. Номер и приложение остаются прежними — нужно только подтвердить вход через Facebook (около 10 минут).

          Если информация полная, бот готов за 2–3 рабочих дня.
        also: ["📝 Подключиться", "🎁 Бесплатный тест"]

      - title: "📝 Подключиться"
        action: form
        form: connect

      - title: "📞 Менеджер"
        action: human

  forms:
    connect:
      steps:
        - ask: "В какой сфере ваш бизнес?"
          label: "Сала"
          options: ["Салон красоты", "Клиника", "Автосервис", "Ресторан, кафе", "Учебный центр", "Фитнес, спорт", "Магазин", "Другое"]
        - ask: "Напишите название бизнеса и город.\nНапример: салон «Ару», Астана"
          label: "Атауы, қаласы"
        - ask: "Спасибо! Заявка готова. Отправить её менеджеру?"
          options: ["📨 Отправить"]
          confirm: true
      done: |
        Ваша заявка отправлена менеджеру ✅
        Он скоро напишет вам на этот номер WhatsApp.

        Команда JasaBot

  human_text: "Передал ваш вопрос менеджеру. Он скоро напишет в этот чат 🙏"
  fallback: "Извините, я отвечаю только через меню. Выберите одну из кнопок ниже 👇"
