# JasaBot — базалық режимдегі мәзір (config.yaml ішінде mode: menu).
# Батырма атауы 20 таңбадан аспауы керек. Бағаларды осы жерде өзгерт.

welcome: |
  Сәлеметсіз бе! Бұл — JasaBot 🤖 Біз бизнеске WhatsApp бот жасаймыз.
  Дәл қазір сөйлесіп отырған осы бот — біз жасайтын боттың үлгісі.

menu:
  text: "Не білгіңіз келеді? Таңдаңыз 👇"
  items:
    - title: "🤖 Бот не істейді"
      answer: |
        Бот клиенттеріңіздің WhatsApp-тағы сұрақтарына тәулік бойы, түнде де жауап береді:
        • бағалар, жұмыс уақыты, мекенжай
        • жазылу өтінімін қабылдап, сізге жеткізеді
        • шеше алмаса, әкімшіге жібереді

        Барлық әңгімені өз телефоныңыздағы WhatsApp Business-тен көресіз. Өзіңіз жазсаңыз, бот сол клиентке араласпайды.
      also: ["💰 Бағасы", "✅ Қосылу"]

    - title: "💰 Бағасы"
      answer: |
        *10 000 ₸/ай*
        Мәзір мен батырмалары бар бот (дәл осы бот сияқты): бағалар, уақыт, мекенжай, жазылу.

        • Орнату — тегін
        • 7 күн тегін сынақ
        • Келісім кемінде 3 айға
        • WhatsApp-тың өз хабарлама ақысы бөлек: айына 1000 хабарлама тегін, одан кейін ~8–9 ₸
      also: ["🎁 Тегін сынақ", "✅ Қосылу"]

    - title: "🎁 Тегін сынақ"
      answer: |
        Ботты 7 күн тегін қолданып көресіз.
        Бот сіздің бағаларыңызбен, сіздің нөміріңізде жұмыс істейді — нәтижесін өз көзіңізбен көресіз.
        Ұнамаса — ештеңе төлемейсіз.
      also: ["✅ Қосылу"]

    - title: "⚙️ Қалай қосылады"
      answer: |
        1. Бизнесіңіз туралы ақпарат жинаймыз: қызметтер, бағалар, жұмыс уақыты, мекенжай.
        2. Ботты баптап, тексереміз.
        3. Қазіргі WhatsApp Business нөміріңізге қосамыз — нөмір мен қосымша сол күйі қалады.
           Сіз тек Facebook арқылы кіріп, телефоныңызда растайсыз (~10 минут).

        Ақпарат толық берілсе, бот 2–3 жұмыс күнінде дайын.
      also: ["✅ Қосылу"]

    - title: "✅ Қосылу"
      action: form
      form: connect

    - title: "📞 Менеджер"
      action: human

forms:
  connect:
    steps:
      - ask: "Бизнесіңіздің түрі қандай?"
        label: "Бизнес"
        options: ["Сұлулық салоны", "Клиника", "Автосервис", "Басқа"]
      - ask: "Қашан хабарласқан ыңғайлы? Мысалы: ертең 14:00"
        label: "Ыңғайлы уақыт"
    done: |
      Рахмет! Өтініміңіз қабылданды ✅
      Менеджер жақын арада хабарласады. — JasaBot

human_text: "Жақсы, менеджерге хабарладым, жақын арада жазады 🙏"
fallback: "Кешіріңіз, мен мәзір арқылы жұмыс істеймін 🙏 Төмендегі батырмалардан таңдаңыз 👇"

# ============================================================
# Орысша нұсқа. Клиент орысша жазса — бот осы мәзірмен жауап береді.
# Құрылымы жоғарыдағыдай. "label" — өтінімде саған көрінетін атау (қазақша қалдырдық).
# ============================================================
ru:
  welcome: |
    Здравствуйте! Это JasaBot 🤖 Мы делаем WhatsApp-ботов для бизнеса.
    Бот, с которым вы сейчас общаетесь, — пример того, что мы делаем.

  menu:
    text: "Что вас интересует? Выберите 👇"
    items:
      - title: "🤖 Что умеет бот"
        answer: |
          Бот отвечает вашим клиентам в WhatsApp круглосуточно, даже ночью:
          • цены, режим работы, адрес
          • принимает заявки на запись и передаёт вам
          • если не может помочь — передаёт администратору

          Все переписки видны в вашем WhatsApp Business на телефоне. Если вы пишете клиенту сами, бот в этот чат не вмешивается.
        also: ["💰 Стоимость", "✅ Подключиться"]

      - title: "💰 Стоимость"
        answer: |
          *10 000 ₸/мес*
          Бот с меню и кнопками (как этот): цены, время, адрес, запись.

          • Настройка — бесплатно
          • 7 дней бесплатного теста
          • Договор минимум на 3 месяца
          • Сообщения WhatsApp оплачиваются отдельно: 1000 сообщений в месяц бесплатно, далее ~8–9 ₸
        also: ["🎁 Бесплатный тест", "✅ Подключиться"]

      - title: "🎁 Бесплатный тест"
        answer: |
          Вы пользуетесь ботом 7 дней бесплатно.
          Бот работает на вашем номере с вашими ценами — результат увидите сами.
          Не понравится — ничего не платите.
        also: ["✅ Подключиться"]

      - title: "⚙️ Как подключить"
        answer: |
          1. Собираем информацию о бизнесе: услуги, цены, режим работы, адрес.
          2. Настраиваем и проверяем бота.
          3. Подключаем к вашему текущему номеру WhatsApp Business — номер и приложение остаются прежними.
             Вы только входите через Facebook и подтверждаете на телефоне (~10 минут).

          Если информация полная, бот готов за 2–3 рабочих дня.
        also: ["✅ Подключиться"]

      - title: "✅ Подключиться"
        action: form
        form: connect

      - title: "📞 Менеджер"
        action: human

  forms:
    connect:
      steps:
        - ask: "Какой у вас бизнес?"
          label: "Бизнес"
          options: ["Салон красоты", "Клиника", "Автосервис", "Другое"]
        - ask: "Когда удобно связаться? Например: завтра 14:00"
          label: "Ыңғайлы уақыт"
      done: |
        Спасибо! Заявка принята ✅
        Менеджер скоро свяжется с вами. — JasaBot

  human_text: "Хорошо, я передал менеджеру, он скоро напишет 🙏"
  fallback: "Извините, я работаю через меню 🙏 Выберите кнопку ниже 👇"
